<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diasgifts.ge</title>
<style>
:root{--ink:#1d2a2e;--chalk:#faf6ec;--saffron:#f2a61b;--teal:#0f6b68;--brick:#c4472b;--line:#e3dcc8;--card:#fffdf7}
*{box-sizing:border-box}
body{margin:0;background:var(--chalk);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Georgian",sans-serif}
header{background:repeating-linear-gradient(90deg,var(--teal) 0 28px,var(--chalk) 28px 56px);padding:0 0 18px}
.bar{background:var(--ink);color:var(--chalk);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar h1{margin:0;font-size:1.5rem;letter-spacing:.5px}
.bar h1 span{color:var(--saffron)}
.bar .r{display:flex;gap:8px;align-items:center}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--saffron);color:var(--ink);font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
main{max-width:900px;margin:0 auto;padding:16px}
.search{display:flex;gap:8px;margin-top:-4px}
input,select,textarea{font:inherit;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.chip{white-space:nowrap;background:#fff;border:1.5px solid var(--line);font-weight:600}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.item{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.item h3{margin:0;font-size:1.1rem}
.price{color:var(--brick);font-weight:800;font-size:1.15rem}
.meta{color:#5d6a6c;font-size:.88rem}
.acts{display:flex;gap:8px;margin-top:auto;padding-top:8px}
.acts a{flex:1;text-align:center;text-decoration:none;padding:9px;border-radius:10px;font-weight:700;color:#fff;background:var(--teal)}
.acts a.wa{background:#1e8e4f}
.del{background:var(--brick);color:#fff;margin-top:6px}
.empty{text-align:center;padding:40px 10px;color:#5d6a6c}
footer{text-align:center;padding:24px 16px 40px}
dialog{border:0;border-radius:16px;padding:18px;width:min(460px,92vw);background:var(--chalk);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
form{display:grid;gap:10px}
label{font-weight:600;font-size:.92rem;display:grid;gap:4px}
.row{display:flex;gap:8px;justify-content:flex-end}
.ghost{background:transparent;border:1.5px solid var(--line);color:inherit}
.bar .ghost{border-color:#4a5b60}
#msg{color:var(--brick);font-size:.9rem;min-height:1.2em}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 id="logo"></h1>
    <div class="r"><button class="ghost" id="langBtn" type="button"></button><button id="addBtn" data-t="sell"></button></div>
  </div>
</header>
<main>
  <div class="search"><input id="q" type="search" data-tp="search" aria-label="Search"></div>
  <div class="chips" id="chips"></div>
  <div id="grid" aria-live="polite"></div>
</main>
<footer><button class="ghost" id="modBtn" type="button"></button></footer>

<dialog id="dlg">
  <form id="f">
    <h2 style="margin:0" data-t="add"></h2>
    <label><span data-t="what"></span><input name="title" required maxlength="80"></label>
    <label><span data-t="price"></span><input name="price" required maxlength="30"></label>
    <label><span data-t="cat"></span><select name="category" required></select></label>
    <label><span data-t="city"></span><input name="city" maxlength="60"></label>
    <label><span data-t="phone"></span><input name="phone" required inputmode="tel" maxlength="20" placeholder="+995..."></label>
    <label><span data-t="desc"></span><textarea name="desc" rows="3" maxlength="400"></textarea></label>
    <div id="msg"></div>
    <div class="row"><button type="button" class="ghost" id="cancel" data-t="cancel"></button><button type="submit" data-t="publish"></button></div>
  </form>
</dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const NAME_MAIN = "Diasgifts", NAME_END = ".ge";   // change these two to rename the site

const app = initializeApp({
  apiKey: "AIzaSyDbgTHe5GN_i-8z_Wr8l4jakvm5JGsH0Bk",
  authDomain: "bazzarge.firebaseapp.com",
  projectId: "bazzarge",
  storageBucket: "bazzarge.firebasestorage.app",
  messagingSenderId: "503925712812",
  appId: "1:503925712812:web:e8e87242b745082dc8bc09"
});
const db = getFirestore(app), auth = getAuth(app);

const T = {
  en:{sell:"+ Sell something",search:"Search items, shops, places",add:"Add a listing",what:"What are you selling?",price:"Price",cat:"Category",city:"City or market",phone:"Phone (with country code)",desc:"Details",cancel:"Cancel",publish:"Publish",call:"Call",empty:"Nothing here yet. Be the first to sell something.",fail:"Could not publish. Please try again.",load:"Could not load listings. Check your connection.",del:"Delete",confirm:"Delete this listing?",noperm:"Only the moderator can delete listings.",login:"Moderator login",logout:"Log out",lang:"ქართული",
    All:"All",Food:"Food",Clothes:"Clothes",Electronics:"Electronics",Home:"Home",Vehicles:"Vehicles",Services:"Services",Other:"Other"},
  ka:{sell:"+ გაყიდვა",search:"ძებნა: ნივთები, მაღაზიები, ადგილები",add:"განცხადების დამატება",what:"რას ყიდით?",price:"ფასი",cat:"კატეგორია",city:"ქალაქი ან ბაზარი",phone:"ტელეფონი (ქვეყნის კოდით)",desc:"დეტალები",cancel:"გაუქმება",publish:"გამოქვეყნება",call:"დარეკვა",empty:"ჯერ არაფერია. იყავით პირველი გამყიდველი.",fail:"გამოქვეყნება ვერ მოხერხდა. სცადეთ თავიდან.",load:"განცხადებები ვერ ჩაიტვირთა. შეამოწმეთ ინტერნეტი.",del:"წაშლა",confirm:"წაშალოთ ეს განცხადება?",noperm:"განცხადების წაშლა მხოლოდ მოდერატორს შეუძლია.",login:"მოდერატორის შესვლა",logout:"გასვლა",lang:"English",
    All:"ყველა",Food:"საკვები",Clothes:"ტანსაცმელი",Electronics:"ელექტრონიკა",Home:"სახლი",Vehicles:"ავტომობილები",Services:"მომსახურება",Other:"სხვა"}
};
const CATS = ["Food","Clothes","Electronics","Home","Vehicles","Services","Other"];
let items = [], cat = "All", term = "", user = null, loadErr = false;
let lang = "en";
try { lang = localStorage.getItem("lang") === "ka" ? "ka" : "en"; } catch (e) {}
const $ = s => document.querySelector(s);
const tr = k => T[lang][k];

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function renderChips(){
  const box = $("#chips"); box.textContent = "";
  ["All", ...CATS].forEach(c => {
    const b = el("button", "chip" + (c === cat ? " on" : ""), tr(c));
    b.onclick = () => { cat = c; renderChips(); render(); };
    box.appendChild(b);
  });
}
function render(){
  const g = $("#grid"); g.textContent = "";
  if (loadErr){ g.appendChild(el("div","empty",tr("load"))); return; }
  const t = term.toLowerCase();
  const list = items.filter(i =>
    (cat === "All" || i.category === cat) &&
    (!t || [i.title, i.desc, i.city].join(" ").toLowerCase().includes(t)));
  if (!list.length){ g.appendChild(el("div","empty",tr("empty"))); return; }
  list.forEach(i => {
    const c = el("article","item");
    c.appendChild(el("h3","",i.title));
    c.appendChild(el("div","price",i.price));
    c.appendChild(el("div","meta",[tr(i.category) || i.category, i.city].filter(Boolean).join(" • ")));
    if (i.desc) c.appendChild(el("div","",i.desc));
    const digits = (i.phone || "").replace(/\D/g,"");
    const acts = el("div","acts");
    const call = el("a","",tr("call")); call.href = "tel:+" + digits;
    const wa = el("a","wa","WhatsApp"); wa.href = "https://wa.me/" + digits; wa.target = "_blank"; wa.rel = "noopener";
    acts.append(call, wa); c.appendChild(acts);
    if (user){
      const d = el("button","del",tr("del"));
      d.onclick = async () => {
        if (!confirm(tr("confirm"))) return;
        try { await deleteDoc(doc(db,"listings",i.id)); }
        catch (err) { alert(tr("noperm")); console.error(err); }
      };
      c.appendChild(d);
    }
    g.appendChild(c);
  });
}
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = tr(e.dataset.t));
  document.querySelectorAll("[data-tp]").forEach(e => e.placeholder = tr(e.dataset.tp));
  $("#langBtn").textContent = tr("lang");
  $("#modBtn").textContent = user ? tr("logout") : tr("login");
  const opts = f.category.value;
  f.category.innerHTML = "";
  CATS.forEach(c => { const o = el("option","",tr(c)); o.value = c; f.category.appendChild(o); });
  if (opts) f.category.value = opts;
  renderChips(); render();
}

const logo = $("#logo");
logo.append(NAME_MAIN, el("span","",NAME_END));
document.title = NAME_MAIN + NAME_END;

const dlg = $("#dlg"), f = $("#f");

onSnapshot(query(collection(db,"listings"), orderBy("createdAt","desc"), limit(200)),
  snap => { loadErr = false; items = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); },
  err => { loadErr = true; render(); console.error(err); });

onAuthStateChanged(auth, u => { user = u; $("#modBtn").textContent = user ? tr("logout") : tr("login"); render(); });
$("#modBtn").onclick = async () => {
  try { user ? await signOut(auth) : await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (err) { console.error(err); alert(err.code || err.message); }
};
$("#langBtn").onclick = () => {
  lang = lang === "en" ? "ka" : "en";
  try { localStorage.setItem("lang", lang); } catch (e) {}
  applyLang();
};
$("#q").oninput = e => { term = e.target.value; render(); };
$("#addBtn").onclick = () => { $("#msg").textContent = ""; dlg.showModal(); };
$("#cancel").onclick = () => dlg.close();
f.onsubmit = async e => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f));
  Object.keys(d).forEach(k => d[k] = String(d[k]).trim());
  try {
    await addDoc(collection(db,"listings"), { ...d, createdAt: serverTimestamp() });
    f.reset(); dlg.close();
  } catch (err) {
    $("#msg").textContent = tr("fail");
    console.error(err);
  }
};
applyLang();
</script>
</body>
</html>
